<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12233F">
<title>304블럭 직관메이트</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root {
  --bg:#EEF1F7;--surface:#fff;--surface-raised:#F8F9FC;--line:#D7DEEB;
  --navy:#12233F;--navy-2:#1D3560;--navy-light:#25406B;
  --text:#16203A;--text-sec:#66768F;--text-muted:#9AA6BC;
  --red:#CE0E2D;--amber:#FFC53D;--green:#0B6E63;
  --font:'Noto Sans KR',system-ui,-apple-system,sans-serif;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0F1A;--surface:#141B2A;--surface-raised:#1A2236;--line:#243044;
  --navy:#0E1928;--navy-2:#1A2C48;--navy-light:#223A5A;
  --text:#D8DDE8;--text-sec:#8090A8;--text-muted:#506070;
}}
:root[data-theme="dark"]{
  --bg:#0A0F1A;--surface:#141B2A;--surface-raised:#1A2236;--line:#243044;
  --navy:#0E1928;--navy-2:#1A2C48;--navy-light:#223A5A;
  --text:#D8DDE8;--text-sec:#8090A8;--text-muted:#506070;
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--font);-webkit-font-smoothing:antialiased;
  font-size:16px;line-height:1.5;
  padding:0 0 calc(40px + env(safe-area-inset-bottom));
}
.wrap{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* ── Hero ── */
.hero{
  background:var(--navy);color:#fff;
  padding:clamp(32px,8vw,48px) 20px clamp(28px,7vw,40px);
  text-align:center;position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 120% 80% at 50% 110%, rgba(255,197,61,.08) 0%, transparent 60%),
    radial-gradient(circle at 20% 20%, rgba(206,14,45,.06) 0%, transparent 40%);
  pointer-events:none;
}
.hero::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--amber),transparent);
}
.hero-icon{
  font-size:42px;margin-bottom:8px;display:block;
  filter:drop-shadow(0 2px 8px rgba(255,197,61,.3));
}
.hero h1{
  font-family:'Black Han Sans',sans-serif;
  font-size:clamp(28px,7.5vw,36px);font-weight:400;
  margin:0 0 4px;letter-spacing:-.5px;
  position:relative;
}
.hero-sub{font-size:14px;color:rgba(255,255,255,.55);margin:0;font-weight:500}
.hero-block{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:14px;padding:5px 14px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);
  border-radius:20px;font-size:12px;color:rgba(255,255,255,.7);font-weight:600;
  letter-spacing:.04em;
}
.hero-block::before{
  content:'';width:6px;height:6px;border-radius:50%;
  background:var(--amber);flex-shrink:0;
}

/* ── Menu Grid ── */
.menu{padding:20px 16px 0;display:flex;flex-direction:column;gap:12px;flex:1}

.menu-card{
  display:flex;align-items:center;gap:16px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:20px 18px;
  text-decoration:none;color:inherit;
  transition:transform .15s, box-shadow .2s;
  position:relative;overflow:hidden;
}
.menu-card:active{transform:scale(.98)}
.menu-card::after{
  content:'›';position:absolute;right:18px;top:50%;transform:translateY(-50%);
  font-size:22px;color:var(--text-muted);font-weight:300;
}

.card-icon{
  width:52px;height:52px;border-radius:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
}
.card-icon.event{
  background:linear-gradient(135deg,var(--red),#E0354F);
  box-shadow:0 4px 12px rgba(206,14,45,.2);
}
.card-icon.seats{
  background:linear-gradient(135deg,var(--navy-2),var(--navy-light));
  box-shadow:0 4px 12px rgba(18,35,63,.25);
}

.card-body{min-width:0}
.card-title{font-size:17px;font-weight:700;margin:0 0 3px;color:var(--text)}
.card-desc{font-size:13px;color:var(--text-sec);margin:0;line-height:1.5}
.card-badge{
  display:inline-block;margin-top:6px;
  font-size:11px;font-weight:700;letter-spacing:.04em;
  padding:2px 8px;border-radius:4px;
}
.card-badge.live{background:rgba(206,14,45,.1);color:var(--red)}
.card-badge.info{background:rgba(29,53,96,.08);color:var(--navy-2)}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .card-badge.live{background:rgba(206,14,45,.2);color:#FF6B7E}
  :root:not([data-theme="light"]) .card-badge.info{background:rgba(37,64,107,.3);color:#7EA8D4}
}
:root[data-theme="dark"] .card-badge.live{background:rgba(206,14,45,.2);color:#FF6B7E}
:root[data-theme="dark"] .card-badge.info{background:rgba(37,64,107,.3);color:#7EA8D4}

/* ── Footer ── */
.footer{
  text-align:center;padding:32px 16px 0;
  font-size:12px;color:var(--text-muted);
}
.footer-logo{
  font-family:'Black Han Sans',sans-serif;
  font-size:14px;color:var(--text-muted);
  letter-spacing:-.3px;margin-bottom:4px;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <span class="hero-icon">⚾</span>
    <h1>직관메이트</h1>
    <p class="hero-sub">두산 베어스 단체 직관 운영 도구</p>
    <span class="hero-block">잠실야구장 304블럭</span>
  </div>

  <nav class="menu">
    <a class="menu-card" href="./event">
      <div class="card-icon event">🎯</div>
      <div class="card-body">
        <p class="card-title">이벤트</p>
        <p class="card-desc">경기 중 좌석 추첨 이벤트 운영</p>
        <span class="card-badge live">EVENT</span>
      </div>
    </a>

    <a class="menu-card" href="./seats">
      <div class="card-icon seats">💺</div>
      <div class="card-body">
        <p class="card-title">좌석 배치도</p>
        <p class="card-desc">304블럭 팀별 좌석 배치 현황</p>
        <span class="card-badge info">MAP</span>
      </div>
    </a>
  </nav>

  <footer class="footer">
    <div class="footer-logo">직관메이트</div>
    <p>두산 베어스 304블럭 단체 직관 도우미</p>
  </footer>

</div>
</body>
</html>
