<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12233F">
<meta name="color-scheme" content="light">
<title>6회말 단관 이벤트 · 304블럭</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --bg:#EEF1F7;--surface:#fff;--line:#D7DEEB;
    --navy:#12233F;--navy-2:#1D3560;--text:#16203A;--muted:#66768F;--red:#CE0E2D;--amber:#FFC53D;
    --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg);-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
    font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased;
    padding:0 0 calc(40px + env(safe-area-inset-bottom));font-size:16px;line-height:1.5}
  .wrap{max-width:600px;margin:0 auto;padding:0 16px}

  .hero{background:var(--navy);color:#fff;padding:24px 0 20px;border-radius:0 0 20px 20px;margin-bottom:14px}
  .kicker{margin:0 0 6px;font-size:14px;font-weight:700;color:var(--amber)}
  h1{margin:0;font-size:clamp(26px,7vw,38px);font-weight:800;letter-spacing:-.03em;line-height:1.05}
  .hero p{margin:12px 0 0;color:#93A5C4;font-size:13.5px;line-height:1.6}

  .banner{background:#FFF8E6;border:1px solid #EBD8A8;color:#7A5600;border-radius:13px;
    padding:13px 15px;font-size:14px;font-weight:600;margin-bottom:12px;display:none}

  /* ── 구장 ── */
  .park{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);
    background:linear-gradient(180deg,#132A50 0%,#1B3A66 55%,#20507F 100%)}
  .park.shake{animation:shake .38s}
  @keyframes shake{
    0%,100%{transform:translate(0,0)}
    20%{transform:translate(-4px,2px)}
    45%{transform:translate(3px,-2px)}
    70%{transform:translate(-2px,1px)}
  }
  .park svg{display:block;width:100%;height:auto}
  .lightpole{opacity:.9}
  .flash{animation:flash 1.1s ease-out}
  @keyframes flash{0%{opacity:.35}25%{opacity:1}100%{opacity:.9}}

  .ball{position:absolute;width:22px;height:22px;left:0;top:0;opacity:0;
    will-change:transform;pointer-events:none}
  .ball svg{width:22px;height:22px}
  .trail{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;
    opacity:.5;pointer-events:none}
  .burst{position:absolute;width:14px;height:14px;border-radius:50%;
    border:3px solid var(--amber);opacity:0;pointer-events:none}
  .spark{position:absolute;width:6px;height:6px;border-radius:2px;pointer-events:none}

  .callout{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;
    font-size:clamp(30px,10vw,52px);font-weight:800;letter-spacing:-.03em;color:#fff;
    text-shadow:0 4px 18px rgba(0,0,0,.5);opacity:0;transform:scale(.6)}
  .callout.on{animation:pop .9s cubic-bezier(.2,1.4,.4,1) forwards}
  @keyframes pop{0%{opacity:0;transform:scale(.5)}55%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}

  /* ── 결과 ── */
  .stage{background:var(--surface);border:1px solid var(--line);border-top:0;
    border-radius:0 0 18px 18px;padding:20px 18px;text-align:center;margin-top:-18px;padding-top:32px}
  .label{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.04em;margin:0}
  .num{font-size:clamp(66px,21vw,104px);font-weight:800;line-height:1;letter-spacing:-.05em;
    color:var(--navy);margin:6px 0 2px;font-variant-numeric:tabular-nums}
  .num.rolling{color:#9AA9C4}
  .num.win{color:var(--red)}
  .team{font-size:19px;font-weight:700;min-height:29px}
  .team.muted{color:#B4BFD3;font-weight:600}

  .btn{width:100%;padding:17px;border-radius:13px;border:1px solid var(--navy);
    background:var(--navy);color:#fff;font:inherit;font-size:17px;font-weight:800;cursor:pointer;margin-top:16px}
  .btn:disabled{opacity:.4;cursor:default}
  .btn.ghost{background:var(--surface);color:var(--text);border-color:var(--line);
    font-size:14.5px;font-weight:600;padding:12px;margin-top:8px}
  .btn.share{background:var(--red);border-color:var(--red)}
  .btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}

  .opt{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:14px;
    color:var(--muted);font-size:14px}
  .opt input{width:20px;height:20px;accent-color:var(--navy)}
  .pool{color:var(--muted);font-size:13px;margin:10px 0 0}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:15px 16px;margin-top:12px}
  .card h2{margin:0 0 10px;font-size:14.5px;font-weight:700;color:var(--muted)}
  .winners{display:flex;flex-wrap:wrap;gap:7px}
  .w{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;
    background:#FDECEF;border:1px solid #F0C2CB;color:var(--red);font-size:13.5px;font-weight:700}
  .w em{font-style:normal;color:#96707A;font-weight:600}
  .empty{color:#9AA6BC;font-size:14px;margin:0}
  .done{margin:10px 0 0;color:#0B6E63;font-size:13.5px;font-weight:600;min-height:19px;text-align:center}
  footer{margin-top:18px;color:var(--muted);font-size:12.5px;line-height:1.7}
</style>
</head>
<body>

<div class="hero"><div class="wrap">
  <p class="kicker">두산 vs NC 단체관람 · 304블럭</p>
  <h1>6회말 단관 이벤트</h1>
  <p>타구가 꽂힌 자리가 당첨입니다. 성인 참석자 대상이며 두린이석 9자리와 진행자석 18번은 빠집니다.</p>
</div></div>

<div class="wrap">

  <div class="banner" id="banner"></div>

  <div class="park" id="park">
    <svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- 조명탑 -->
      <g class="lightpole" id="lights">
        <rect x="60" y="18" width="70" height="26" rx="5" fill="#F4E7B8"/>
        <rect x="90" y="44" width="6" height="34" fill="#4A5F86"/>
        <rect x="470" y="14" width="70" height="26" rx="5" fill="#F4E7B8"/>
        <rect x="500" y="40" width="6" height="38" fill="#4A5F86"/>
      </g>
      <!-- 관중석 -->
      <path d="M0 78 L600 66 L600 132 L0 148 Z" fill="#25406B"/>
      <g fill="#33538A">
        <rect x="12" y="88" width="574" height="13" rx="4"/>
        <rect x="12" y="107" width="574" height="13" rx="4"/>
        <rect x="12" y="126" width="574" height="13" rx="4"/>
      </g>
      <!-- 외야 펜스 -->
      <rect x="0" y="146" width="600" height="16" fill="#123A2A"/>
      <!-- 잔디 -->
      <path d="M0 160 L600 160 L600 300 L0 300 Z" fill="#2F7D3C"/>
      <path d="M0 160 L600 160 L600 300 L0 300 Z" fill="url(#mow)" opacity=".35"/>
      <defs>
        <pattern id="mow" width="52" height="52" patternUnits="userSpaceOnUse">
          <rect width="26" height="52" fill="#3B9149"/>
        </pattern>
      </defs>
      <!-- 내야 흙 -->
      <path d="M300 292 L150 214 A200 200 0 0 1 450 214 Z" fill="#B4784A" opacity=".95"/>
      <path d="M300 276 L206 216 A130 130 0 0 1 394 216 Z" fill="#3B9149"/>
      <!-- 베이스 -->
      <g fill="#fff">
        <rect x="295" y="284" width="11" height="11" rx="2" transform="rotate(45 300 289)"/>
        <rect x="374" y="216" width="10" height="10" rx="2" transform="rotate(45 379 221)"/>
        <rect x="295" y="196" width="10" height="10" rx="2" transform="rotate(45 300 201)"/>
        <rect x="216" y="216" width="10" height="10" rx="2" transform="rotate(45 221 221)"/>
      </g>
      <!-- 마운드 -->
      <ellipse cx="300" cy="240" rx="20" ry="11" fill="#B4784A"/>
    </svg>

    <div class="callout" id="callout">홈런!</div>
    <div class="ball" id="ball">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#fff"/>
        <path d="M5 4 Q9 12 5 20" stroke="#CE0E2D" stroke-width="1.6" fill="none"/>
        <path d="M19 4 Q15 12 19 20" stroke="#CE0E2D" stroke-width="1.6" fill="none"/>
      </svg>
    </div>
  </div>

  <div class="stage">
    <p class="label">당첨 좌석</p>
    <div class="num" id="num">--</div>
    <div class="team muted" id="team">버튼을 누르면 타구가 날아갑니다</div>
    <button class="btn" id="spin">타석에 들어서기</button>
    <div class="opt">
      <input type="checkbox" id="dedupe" checked>
      <label for="dedupe">이미 당첨된 좌석은 제외</label>
    </div>
    <p class="pool" id="pool"></p>
  </div>

  <div class="card">
    <h2>당첨 기록</h2>
    <div class="winners" id="winners"></div>
    <p class="empty" id="noWin">아직 없습니다.</p>
    <button class="btn share" id="share">결과 링크 복사하기</button>
    <button class="btn ghost" id="reset">기록 지우기</button>
    <p class="done" id="done" role="status"></p>
  </div>

  <footer>
    대상 40석 · 두린이석(1·23·24·25·26·44·45·49·50)과 진행자석(18번)은 제외됩니다.<br>
    결과 링크를 단톡방에 올리면 모두가 같은 당첨 번호를 볼 수 있습니다.
  </footer>

</div>

<script>
var SEATS = {
  1:"해피서균",2:"해피서균",3:"해피서균",4:"두두두산",5:"병쪽이",6:"박상덕",7:"포도봉봉",
  8:"여명이",9:"바니바니바",10:"MJ",11:"V7원해요",12:"V7원해요",
  13:"곰팀",14:"곰팀",15:"곰팀",16:"곰팀",17:"곰팀",18:"10번타자",
  19:"병아리",20:"병아리",21:"병아리",22:"병아리",23:"병아리",24:"병아리",
  25:"이대두산",26:"이대두산",27:"이대두산",28:"이대두산",29:"이대두산",
  30:"룰룰",31:"룰룰",32:"줄리아",33:"줄리아",34:"고블찡",35:"고블찡",36:"쩨리",37:"카레",
  38:"10번타자 지인",39:"허슬두링",40:"허슬두링",41:"허슬두링",42:"허슬두링",43:"허슬두링",
  44:"hyunme",45:"hyunme",46:"hyunme",47:"하얀미르",48:"하얀미르",49:"하얀미르",50:"하얀미르"
};
var KID = [1,23,24,25,26,44,45,49,50];
var HOST = [18];
var ELIGIBLE = Object.keys(SEATS).map(Number).filter(function(n){
  return KID.indexOf(n) === -1 && HOST.indexOf(n) === -1;
}).sort(function(a,b){ return a-b; });

var park = document.getElementById('park');
var ball = document.getElementById('ball');
var callout = document.getElementById('callout');
var lights = document.getElementById('lights');
var numEl = document.getElementById('num');
var teamEl = document.getElementById('team');
var spinBtn = document.getElementById('spin');
var dedupe = document.getElementById('dedupe');
var poolEl = document.getElementById('pool');
var winnersEl = document.getElementById('winners');
var noWinEl = document.getElementById('noWin');
var shareBtn = document.getElementById('share');
var resetBtn = document.getElementById('reset');
var doneMsg = document.getElementById('done');
var banner = document.getElementById('banner');

var winners = [];
var spinning = false;

/* 공유 링크로 들어온 경우 */
(function readShared(){
  var m = location.search.match(/[?&]w=([0-9,]+)/);
  if (!m) return;
  var list = m[1].split(',').map(Number).filter(function(n){ return SEATS[n]; });
  if (!list.length) return;
  winners = list;
  banner.style.display = 'block';
  banner.textContent = '진행자가 공유한 결과입니다. 아래 당첨 기록을 확인해 주세요.';
  var last = winners[winners.length - 1];
  numEl.textContent = last;
  numEl.className = 'num win';
  teamEl.className = 'team';
  teamEl.textContent = SEATS[last] + ' 팀';
  spinBtn.textContent = '직접 돌려보기';
})();

function pool(){
  if (!dedupe.checked) return ELIGIBLE.slice();
  return ELIGIBLE.filter(function(n){ return winners.indexOf(n) === -1; });
}

function renderPool(){
  var p = pool();
  poolEl.textContent = '남은 대상 ' + p.length + '석 / 전체 ' + ELIGIBLE.length + '석';
  spinBtn.disabled = spinning || p.length === 0;
  if (p.length === 0 && !spinning){
    teamEl.textContent = '대상 좌석을 모두 뽑았습니다';
    teamEl.className = 'team muted';
  }
}

function renderWinners(){
  winnersEl.innerHTML = '';
  noWinEl.style.display = winners.length ? 'none' : 'block';
  shareBtn.disabled = !winners.length;
  winners.forEach(function(n, i){
    var d = document.createElement('span');
    d.className = 'w';
    d.innerHTML = '<em>' + (i+1) + '회</em> ' + n + '번 · ' + SEATS[n];
    winnersEl.appendChild(d);
  });
  renderPool();
}

/* ── 타구 애니메이션 ── */
function flight(onLand){
  var W = park.clientWidth, H = park.clientHeight;
  var x0 = W * 0.50, y0 = H * 0.94;              // 홈플레이트
  var x1 = W * (0.55 + Math.random() * 0.32);    // 관중석 착탄점
  var y1 = H * (0.28 + Math.random() * 0.10);
  var peak = H * 0.16;
  var dur = 1750, start = performance.now();

  ball.style.opacity = '1';
  var trails = [];

  function frame(now){
    var t = Math.min(1, (now - start) / dur);
    var e = t;
    var x = x0 + (x1 - x0) * e;
    var y = y0 + (y1 - y0) * e - Math.sin(Math.PI * e) * (y0 - peak) * 0.55;
    ball.style.transform = 'translate(' + (x - 11) + 'px,' + (y - 11) + 'px) rotate(' + (t * 900) + 'deg)';

    if (t < 0.96 && Math.random() < 0.55){
      var tr = document.createElement('div');
      tr.className = 'trail';
      tr.style.left = (x - 3) + 'px';
      tr.style.top = (y - 3) + 'px';
      park.appendChild(tr);
      trails.push(tr);
      setTimeout(function(){ tr.style.transition = 'opacity .5s'; tr.style.opacity = '0'; }, 20);
      setTimeout(function(){ if (tr.parentNode) tr.parentNode.removeChild(tr); }, 560);
    }

    if (t < 1) requestAnimationFrame(frame);
    else land(x, y, onLand);
  }
  requestAnimationFrame(frame);
}

function land(x, y, cb){
  ball.style.opacity = '0';
  park.classList.add('shake');
  lights.classList.add('flash');
  setTimeout(function(){ park.classList.remove('shake'); lights.classList.remove('flash'); }, 1150);

  var b = document.createElement('div');
  b.className = 'burst';
  b.style.left = (x - 7) + 'px';
  b.style.top = (y - 7) + 'px';
  park.appendChild(b);
  requestAnimationFrame(function(){
    b.style.transition = 'transform .55s cubic-bezier(.2,.8,.3,1), opacity .55s';
    b.style.opacity = '1';
    b.style.transform = 'scale(7)';
    setTimeout(function(){ b.style.opacity = '0'; }, 300);
  });
  setTimeout(function(){ if (b.parentNode) b.parentNode.removeChild(b); }, 700);

  var colors = ['#FFC53D','#fff','#CE0E2D','#8FE0D6'];
  for (var i = 0; i < 22; i++){
    (function(){
      var s = document.createElement('div');
      s.className = 'spark';
      s.style.left = (x - 3) + 'px';
      s.style.top = (y - 3) + 'px';
      s.style.background = colors[i % colors.length];
      park.appendChild(s);
      var ang = Math.random() * Math.PI * 2;
      var dist = 40 + Math.random() * 90;
      requestAnimationFrame(function(){
        s.style.transition = 'transform .85s cubic-bezier(.15,.8,.3,1), opacity .85s';
        s.style.transform = 'translate(' + Math.cos(ang) * dist + 'px,' + (Math.sin(ang) * dist + 40) + 'px) rotate(' + (Math.random()*540) + 'deg)';
        s.style.opacity = '0';
      });
      setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); }, 900);
    })();
  }

  callout.classList.remove('on');
  void callout.offsetWidth;
  callout.classList.add('on');
  setTimeout(function(){ callout.classList.remove('on'); callout.style.opacity = '0'; }, 1600);

  cb();
}

function spin(){
  var p = pool();
  if (spinning || !p.length) return;
  spinning = true;
  spinBtn.disabled = true;
  banner.style.display = 'none';
  doneMsg.textContent = '';
  numEl.className = 'num rolling';
  teamEl.className = 'team muted';
  teamEl.textContent = '타구 추적 중...';

  var target = p[Math.floor(Math.random() * p.length)];
  var rolling = setInterval(function(){
    numEl.textContent = p[Math.floor(Math.random() * p.length)];
  }, 70);

  flight(function(){
    clearInterval(rolling);
    numEl.textContent = target;
    numEl.className = 'num win';
    teamEl.className = 'team';
    teamEl.textContent = SEATS[target] + ' 팀';
    winners.push(target);
    spinning = false;
    spinBtn.textContent = '한 번 더 치기';
    renderWinners();
  });
}

spinBtn.addEventListener('click', spin);
dedupe.addEventListener('change', renderPool);

resetBtn.addEventListener('click', function(){
  if (spinning) return;
  winners = [];
  numEl.textContent = '--';
  numEl.className = 'num';
  teamEl.textContent = '버튼을 누르면 타구가 날아갑니다';
  teamEl.className = 'team muted';
  banner.style.display = 'none';
  doneMsg.textContent = '';
  spinBtn.textContent = '타석에 들어서기';
  renderWinners();
});

shareBtn.addEventListener('click', function(){
  if (!winners.length) return;
  var url = location.origin + location.pathname + '?w=' + winners.join(',');
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
    document.body.removeChild(ta);
    doneMsg.textContent = ok ? '링크를 복사했습니다. 단톡방에 올려 주세요.' : '복사 실패. 주소창의 링크를 직접 복사해 주세요.';
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(function(){
      doneMsg.textContent = '링크를 복사했습니다. 단톡방에 올려 주세요.';
    })['catch'](fallback);
  } else { fallback(); }
});

renderWinners();
</script>
</body>
</html>
